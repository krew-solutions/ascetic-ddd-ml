\* Whether the handler is attached is read, and the call counted, in two
\* steps, not under one lock.  TLC must find a call made after a cancel has
\* returned: the cancel came between the two.
SPECIFICATION Spec
CONSTANTS
  Callers = {d1}
  Cancellers = {c1}
  Messages = 1
  AdmitUnderLock = FALSE
  WaitForDetach = TRUE
  RegisterUnderLock = TRUE
  InsideMark = TRUE
INVARIANTS
  Quiet
