\* A cancel that finds the detaching taken by another goes on at once, as
\* first written.  TLC must find a cancel that has returned while a call is in
\* flight: the first canceller was still waiting for the lock to detach under.
SPECIFICATION Spec
CONSTANTS
  Callers = {d1}
  Cancellers = {c1, c2}
  Messages = 1
  AdmitUnderLock = TRUE
  WaitForDetach = FALSE
  RegisterUnderLock = TRUE
  InsideMark = TRUE
INVARIANTS
  Quiet
