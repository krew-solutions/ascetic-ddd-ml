\* That something is in flight is read, and the waiter registered, in two
\* steps, not under one lock.  TLC must find a waiter with nothing to wait
\* for: the last call was counted out between the two, and woke nobody.
SPECIFICATION Spec
CONSTANTS
  Callers = {d1}
  Cancellers = {c1}
  Messages = 1
  AdmitUnderLock = TRUE
  WaitForDetach = TRUE
  RegisterUnderLock = FALSE
  InsideMark = TRUE
INVARIANTS
  NoLostWake
