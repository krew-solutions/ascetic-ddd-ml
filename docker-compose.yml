services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      # Use a non-default host port to avoid colliding with a system PG.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 5s
      retries: 15
    # Ephemeral data — wipe on container removal. Suitable for tests.
    tmpfs:
      - /var/lib/postgresql/data

  # A Kafka-API broker for the tests of ascetic_ddd.bus.kafka:
  #   export TEST_KAFKA_BROKERS=localhost:59092
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:59092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "59092:9092"

  # A Vault dev server for the tests of ascetic_ddd.kms.vault:
  #   export TEST_VAULT_ADDR=http://localhost:58200 TEST_VAULT_TOKEN=test-root-token
  # The tests enable the transit engine themselves.
  vault:
    image: hashicorp/vault:1.17
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: test-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "58200:8200"
